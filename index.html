<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="content_style.css">
    <link rel="stylesheet" href="content_questions_style.css">
    <link rel="stylesheet" href="content_start_style.css">
</head>

<body>
    <div class="content">
        <div class="content-question">
            <div class="content-question-ask">
                <p id="question-title">How to delete a folder in linux ?</p>
            </div>
            <div class="content-question-options">
                <div class="content-question-options">
                    <input type="radio" name="q1" value="ls">
                    <span>ls</span>
                </div>
                <div class="content-question-options">
                    <input type="radio" name="q1" value="ls">
                    <span>delete</span>
                </div>
                <div class="content-question-options">
                    <input type="radio" name="q1" value="ls">
                    <span>remove</span>
                </div>
                <div class="content-question-options">
                    <input type="radio" name="q1" value="ls">
                    <span>rmdir</span>
                </div>
            </div>
            <div class="content-question-button">
                <button class="content-question-button-press-hover content-question-button-press" id="question-subimit-button">
                    Subimit
                </button>
                <div class="content-question-button-back">
                    <button class="content-question-button-back-forward-hover" id="question-previous-button"><</button>
                </div>
                <div class="content-question-button-forward">
                    <button class="content-question-button-back-forward-hover" id="question-next-button">></button>
                </div>
            </div>
            <div class="content-question-progress">
                <div class="content-question-progress-bar" id="progress-bar"></div>

            </div>
            <div class="content-question-explanation">
                <div class="content-question-explanation-title">
                    <span>Explanation:</span>
                </div>
                <div class="content-question-explanation-body">
                    <p> 
                        The explanation will appear here after you subimit your guess!
                    </p>
                </div>
            </div>
        </div>
        <div class="content-start">
            <div class="content-start-title">
                <h2>Quiz Time!</h2>
            </div>
            <div class="content-start-description">
                <h5>Test your knowledge with until 20 questions</h5>
            </div>
            <div class="content-start-config">
                <div class="content-start-config-category">
                    <select name="category" id="quiz-category">
                        <option value="none">Choose category</option>
                        <option value="Random">Random</option>
                        <option value="Linux">Linux</option>
                        <option value="DevOps">DevOps</option>
                        <option value="Code">Code</option>
                        <option value="react">react</option>
                        <option value="Cloud">Cloud</option>
                        <option value="Docker">Docker</option>
                        <option value="sql">SQL</option>
                    </select>
                </div>
                <div class="content-start-config-difficulty">
                    <select name="dificullty" id="quiz-difficulty">
                        <option value="none">Choose dificulty</option>
                        <option value="Random">Random</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div class="content-start-config-amount">
                    <select name="limit" id="quiz-limit">
                        <option value="none">Choose amount</option>
                        <option value="Random">Random</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                    </select>
                </div>
            </div>
            <div class="content-start-button">
                <button id="start-quiz-button">Start quiz</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
